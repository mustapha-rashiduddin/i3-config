# picom -- X11 compositor, autostarted from the i3 config.
#
# Why this exists: with no compositor, every X client memcpys straight into
# the front buffer with nothing tied to vblank. A workspace switch is a
# multi-millisecond sequence of unmap/repaint/map writes, and the scanout
# beam slices through the middle of it -- that's the tearing. A compositor
# turns the whole thing into one atomic page flip.

# glx, not xrender. The Intel i915/glamor driver gives us GL 3.3+, and glx
# is the backend that actually syncs its swap to vblank. xrender is the
# safe fallback if glx ever turns out to misbehave here.
backend = "glx";

# Picom's own default is true, but set it explicitly -- this is the whole
# point of running the compositor, so it shouldn't depend on an upstream
# default staying put. (Note the NixOS/Home Manager `services.picom.vSync`
# option defaults to *false*, so that module would need overriding.)
vsync = true;

# Hard-pin this off. Picom treats it as opt-in, but it is the single most
# common way to end up with the tearing back: it lets fullscreen windows
# bypass the compositor and draw direct-to-scanout, which is exactly the
# path we are trying to eliminate.
unredir-if-possible = false;

# No fade on open/close. Window map/unmap is precisely when a workspace
# switch repaints, and an animation there just means several extra full
# redraws -- each one another chance to tear.
no-fading-openclose = true;

# Track damage so we only repaint what changed. On a workspace switch i3
# damages the whole screen anyway, so this costs nothing there and saves
# bandwidth everywhere else.
use-damage = true;

# Troubleshooting only -- uncomment if animations or fullscreen video feel
# stuttery. Disables frame pacing, so renders stop being timed to land
# just before vblank.
#no-frame-pacing = true;